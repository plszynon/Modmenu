name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kompilacja w Dockerze
        run: |
          docker run --rm -v "$PWD:/src" -w /src flipacholas/ps3devextra:latest make all
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: wynik
          path: |
            *.sprx
            *.self
            *.elf
